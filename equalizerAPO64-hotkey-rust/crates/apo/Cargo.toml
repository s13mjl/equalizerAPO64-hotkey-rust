[package]
name = "eapo-apo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Verification-only class id that lets a running audiodg.exe load this DLL
# without restarting the audio service. Never enabled for shipped builds.
live-probe = []

[lib]
name = "EqualizerAPO"
crate-type = ["cdylib", "rlib"]

[dependencies]
eapo-common.workspace = true
eapo-apo-info.workspace = true
eapo-engine.workspace = true
windows = { workspace = true, features = [
    "Win32_Media_Audio_Apo",
    "Win32_System_Variant",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_SystemServices",
] }
once_cell.workspace = true

